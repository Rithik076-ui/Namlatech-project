<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="edithotel.css">
</head>

<body>

  <div class="grid-css">
    <div class="add-hotel-grid">
      <div class="add-title-info">
        <button class="back-button" type="button" onclick="location.href='index.html'">&#x2190; Back</button>
        <p class="add-hotel" id="page-heading">Add Hotel</p>
        <p class="not-found" id="not-found" hidden>This hotel could not be found. It may have been deleted.</p>

        <form id="hotel-form">
          <label for="image">Image</label>
          <div class="image-preview">
            <img class="image-insert" id="preview-img" alt="Hotel image preview">
            <div class="files-insert">
              <input type="file" id="image" name="image" accept="image/*">
            </div>
          </div>

          <div class="title-insert">
            <label for="title">Title</label>
            <input class="field" type="text" id="title" name="title" required maxlength="80">
          </div>

          <div>
            <label for="description">Description</label>
            <textarea class="field" id="description" name="description" rows="5"></textarea>
          </div>

          <div class="lat-long">
            <div>
              <label for="latitude">Latitude</label>
              <input class="field latitude" type="number" step="any" min="-90" max="90" id="latitude" name="latitude">
            </div>
            <div>
              <label for="longitude">Longitude</label>
              <input class="field longitude" type="number" step="any" min="-180" max="180" id="longitude"
                name="longitude">
            </div>
          </div>

          <div>
            <label for="price">Price per night (&#8377;)</label>
            <input class="field price" type="number" id="price" name="price" min="0" required>
          </div>

          <div class="form-buttons">
            <button class="save-button" type="submit">Save</button>
            <button class="cancel-button" type="button" onclick="location.href='index.html'">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="edithotel.js"></script>
</body>

</html>
