<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="grid.css">
</head>

<body>
  <div class="header">
    <a class="leftsec" href="index.html">
      <img class="header-img" src="images/premium_photo-1661964071015-d97428970584.avif" alt="">
      <p class="header-title">Hotel Booking</p>
    </a>
    <div class="middlesection">
      <input class="search-bar" id="search-bar" name="search" placeholder="Search by Title" type="text"
        aria-label="Search hotels by title" autocomplete="off">
      <button class="search-button" id="search-button" type="button" aria-label="Search">
        <img class="searchimg" src="images/search.svg" alt="">
      </button>

      <button class="filter-button" id="filter-button" type="button" aria-label="Filter by price"
        aria-haspopup="true" aria-expanded="false" aria-controls="filter-panel">
        <svg class="filter-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M3 4h18l-7 8.5V19l-4 2v-8.5z" fill="currentColor"></path>
        </svg>
        <span class="filter-label">Filter</span>
      </button>

      <form class="filter-panel" id="filter-panel" aria-label="Filter by price" novalidate hidden>
        <p class="filter-title">Price per night (&#8377;)</p>
        <div class="filter-fields">
          <label class="filter-field" for="min-price">Min
            <input id="min-price" name="min" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
          </label>
          <span class="filter-dash" aria-hidden="true">&ndash;</span>
          <label class="filter-field" for="max-price">Max
            <input id="max-price" name="max" type="number" min="0" step="any" inputmode="decimal" placeholder="Any">
          </label>
        </div>
        <p class="filter-hint" id="filter-hint"></p>
        <div class="filter-actions">
          <button class="filter-clear" id="filter-clear" type="button">Clear</button>
          <button class="filter-apply" type="submit">Apply</button>
        </div>
      </form>
    </div>
    <div class="rightsec">
      <a class="addhotel" href="edithotel.html">Add Hotel</a>
    </div>
  </div>

  <main>
    <div class="filter-summary" id="filter-summary" hidden>
      <span class="filter-summary-text" id="filter-summary-text"></span>
      <button class="filter-summary-clear" id="filter-summary-clear" type="button">Clear filter &times;</button>
    </div>
    <p class="empty-msg" id="empty-msg" hidden></p>
    <div class="body-grid" id="hotel-grid"></div>
  </main>

  <script src="common.js"></script>
  <script src="index.js"></script>
</body>

</html>
